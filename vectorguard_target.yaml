# VectorGuard target definition for InjectionRange.
# Point VectorGuard at this file to drive the /api/chat endpoint as a generic
# HTTP target — no custom adapter code required.
#
#   python -m vectorguard.cli run \
#       --target vectorguard_target.yaml \
#       --suite suites/rag_injection.yaml \
#       --report reports/rag_injection.json

target:
  name: injectionrange
  type: http
  url: http://localhost:8000/api/chat
  method: POST
  headers:
    Content-Type: application/json

  # VectorGuard substitutes {{last_user_message}} with the attack turn. Multi-turn
  # suites thread state via conversation_id (echoed back in the response).
  body_template: |
    {"message": "{{last_user_message}}", "conversation_id": "{{conversation_id}}"}

  # Stable, documented JSON path to the model's answer.
  response_path: answer

  # Optional fields VectorGuard can read for richer reporting / local RAG scan.
  metadata_paths:
    mode: mode
    conversation_id: conversation_id
    retrieved_chunk_ids: retrieved_chunk_ids
    citations: citations

# Protected values mirror the app's canary config so detectors have real bait.
# These are FAKE canaries — never real secrets. Keep in sync with .env.
protected:
  - id: secret_token
    value: RAGGUARD_CANARY_TOKEN_PLACEHOLDER
  - id: policy_name
    value: RAGGUARD_POLICY_ALPHA
  - id: internal_email
    value: admin@ragguard.local
  - id: system_marker
    value: RAGGUARD_SYSTEM_MARKER

# Local RAG scan mode: point at the on-disk corpus to inspect which poisoned
# chunks are retrievable and what metadata (source file, label, score) surfaces.
rag_scan:
  search_url: http://localhost:8000/api/search
  search_body_template: |
    {"query": "{{probe}}", "top_k": 25}
  results_path: results
  chunk_fields:
    id: chunk_id
    source: filename
    label: corpus_label
    score: rerank_score
    content: content
